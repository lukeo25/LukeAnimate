<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Luke Animate</title>
<link rel="icon" type="image/png" href="LukeIcon.png">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f3}
  #luke-animate-editor{display:block;width:100%;height:100%;border:0;background:#eef0f3}
</style>
</head>
<body>
<iframe id="luke-animate-editor" src="editor.html?v=185" title="Luke Animate"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('luke-animate-editor');
  if(!frame)return;
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('luke-animate-layer-lock-loader-v5'))return;
      const script=doc.createElement('script');
      script.id='luke-animate-layer-lock-loader-v5';
      script.src='layer-lock.js?v=5.0.0';
      script.async=false;
      doc.body.appendChild(script);
    }catch(error){
      console.error('Luke Animate layer locking could not be loaded:',error);
    }
  });
})();
</script>
</body>
</html>
