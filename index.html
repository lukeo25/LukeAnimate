<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Luke Animate</title>
<link rel="icon" type="image/png" href="LukeIcon.png">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f3}
  #luke-animate-editor{display:block;width:100%;height:100%;border:0;background:#eef0f3}
</style>
</head>
<body>
<iframe id="luke-animate-editor" src="editor.html?v=185.6" title="Luke Animate"></iframe>
<script>
(function(){
  'use strict';

  const frame=document.getElementById('luke-animate-editor');
  if(!frame)return;

  function loadScript(doc,id,src){
    if(!doc||doc.getElementById(id))return;
    const script=doc.createElement('script');
    script.id=id;
    script.src=src;
    script.async=false;
    doc.body.appendChild(script);
  }

  function installLayerLock(doc){
    loadScript(doc,'luke-animate-layer-lock-loader-v51','layer-lock.js?v=5.1.0');
  }

  function installSelectionBehavior(doc){
    loadScript(doc,'luke-animate-selection-behavior-loader-v1','selection-behavior.js?v=1.0.0');
  }

  function selectedMedia(win){
    const API=win&&win.LukeAnimate;
    if(!API||typeof API.getSelectedDrawObjects!=='function')return null;
    const selected=(API.getSelectedDrawObjects()||[]).filter(obj=>
      obj&&(obj.type==='image'||obj.type==='video')
    );
    return selected.length===1?selected[0]:null;
  }

  function fitMediaExactlyToStage(win,obj,pushUndo){
    const API=win&&win.LukeAnimate;
    if(!API||!obj)return false;

    const stageWidth=Math.max(1,Number(API.width)||1);
    const stageHeight=Math.max(1,Number(API.height)||1);

    if(pushUndo&&typeof API.pushUndo==='function')API.pushUndo();

    obj.x=0;
    obj.y=0;
    obj.width=stageWidth;
    obj.height=stageHeight;
    obj.tx=0;
    obj.ty=0;
    obj.tscale=1;
    obj.tscaleX=1;
    obj.tscaleY=1;
    obj.trotation=0;

    if(typeof API.refreshUI==='function')API.refreshUI();
    return true;
  }

  function installFitStageExact(doc){
    if(!doc)return;
    const win=doc.defaultView;
    const button=doc.getElementById('btn-media-fit-stage');
    if(!win||!button||button.dataset.fitStageExact==='1')return;

    button.dataset.fitStageExact='1';
    button.title='Fit selected media exactly to the stage in X and Y';

    button.addEventListener('click',(event)=>{
      event.preventDefault();
      event.stopImmediatePropagation();
      event.stopPropagation();
      const obj=selectedMedia(win);
      if(!obj)return;
      fitMediaExactlyToStage(win,obj,true);
    },true);
  }

  function installReferenceMediaFillStageExact(doc){
    if(!doc)return;
    const win=doc.defaultView;
    const fitSelect=doc.getElementById('sel-media-fit');
    const status=doc.getElementById('media-import-status');
    if(!win||!fitSelect||!status||status.dataset.exactFillStageObserver==='1')return;

    status.dataset.exactFillStageObserver='1';

    const coverOption=fitSelect.querySelector('option[value="cover"]');
    if(coverOption)coverOption.textContent='Fit to stage';

    const applyImportedExactFit=()=>{
      if(fitSelect.value!=='cover')return;
      const text=String(status.textContent||'');
      if(!text.includes(' added as '))return;
      const obj=selectedMedia(win);
      if(!obj)return;
      fitMediaExactlyToStage(win,obj,false);
    };

    const observer=new MutationObserver(()=>{
      requestAnimationFrame(applyImportedExactFit);
    });
    observer.observe(status,{childList:true,characterData:true,subtree:true});
  }

  function installLockDeselectionBridge(doc){
    if(!doc||doc.documentElement.dataset.lockDeselectionBridge==='1')return;
    doc.documentElement.dataset.lockDeselectionBridge='1';

    doc.addEventListener('pointerdown',event=>{
      const button=event.target&&event.target.closest
        ?event.target.closest('.timeline-layer-lock-button')
        :null;
      if(!button)return;

      requestAnimationFrame(()=>{
        try{
          if(button.classList.contains('locked')){
            const win=doc.defaultView;
            const behavior=win&&win.LukeAnimateSelectionBehavior;
            if(behavior&&typeof behavior.clearSelection==='function'){
              behavior.clearSelection();
            }
          }
        }catch(error){
          console.error('Luke Animate lock deselection failed:',error);
        }
      });
    },false);
  }

  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      installSelectionBehavior(doc);
      installLayerLock(doc);
      installFitStageExact(doc);
      installReferenceMediaFillStageExact(doc);
      installLockDeselectionBridge(doc);
    }catch(error){
      console.error('Luke Animate page extensions could not be loaded:',error);
    }
  });
})();
</script>
</body>
</html>
