<style>
  :root{
    --bg:#eef0f3;
    --panel:#ffffff;
    --panel-2:#f1f2f5;
    --line:#d9dce1;
    --text:#1b1f24;
    --text-dim:#6b7280;
    --accent:#0e9c86;
    --accent-dim:#3fae9b;

    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  body.published-game-mode{
    display:block;
    background:#000;
    overflow:hidden;
    user-select:none;
  }
  body.published-game-mode #topbar,
  body.published-game-mode #sidebar-column,
  body.published-game-mode #timeline-dock,
  body.published-game-mode #zoom-controls,
  body.published-game-mode #clip-breadcrumb,
  body.published-game-mode #offstage-proxy-layer,
  body.published-game-mode #horizontal-ruler,
  body.published-game-mode #vertical-ruler,
  body.published-game-mode #ruler-corner,
  body.published-game-mode #edit-overlay,
  body.published-game-mode #stage-text-editor,
  body.published-game-mode .floating-panel{
    display:none!important;
  }
  body.published-game-mode #main-row,
  body.published-game-mode #stage-wrap{
    width:100vw;
    height:100vh;
    min-width:0;
    min-height:0;
    padding:0;
    margin:0;
    overflow:hidden;
    background:#000;
  }
  body.published-game-mode #stage-workspace,
  body.published-game-mode #stage-workspace.rulers-hidden{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    margin:0;
  }
  body.published-game-mode #canvas-shell{
    flex:0 0 auto;
    max-width:none;
    max-height:none;
    box-shadow:none;
    overflow:hidden;
  }
  body.published-game-mode #fx-canvas{
    max-width:none;
    max-height:none;
  }
  #main-row{
    flex:1;
    display:flex;
    min-height:0;
    overflow:hidden;
  }
  /* ---------- layout ---------- */
  #stage-wrap{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    position:relative;
    overflow:auto;
    padding:72px 16px 16px;
    background:
      linear-gradient(45deg,#e0e3e8 25%,transparent 25%) -20px 0/40px 40px,
      linear-gradient(-45deg,#e0e3e8 25%,transparent 25%) -20px 0/40px 40px,
      linear-gradient(45deg,transparent 75%,#e0e3e8 75%) -20px 0/40px 40px,
      linear-gradient(-45deg,transparent 75%,#e0e3e8 75%) -20px 0/40px 40px,
      #f5f6f8;
    background-size:40px 40px;
  }
  #stage-workspace{
    position:relative;
    display:grid;
    grid-template-columns:24px auto;
    grid-template-rows:24px auto;
    align-items:start;
    justify-items:start;
    margin:auto;
    max-width:100%;
    max-height:100%;
  }
  #stage-workspace.rulers-hidden{grid-template-columns:0 auto;grid-template-rows:0 auto;}
  #stage-workspace.rulers-hidden #ruler-corner,
  #stage-workspace.rulers-hidden .stage-ruler{display:none;}
  #ruler-corner{
    grid-column:1; grid-row:1;
    width:24px; height:24px;
    background:#f7f8fa;
    border-right:1px solid #c8cdd4;
    border-bottom:1px solid #c8cdd4;
    position:relative; z-index:6;
  }
  #ruler-corner::after{
    content:''; position:absolute; left:6px; top:6px; width:10px; height:10px;
    border-left:2px solid #8a929d; border-top:2px solid #8a929d;
  }
  .stage-ruler{
    display:block;
    background:#f7f8fa;
    position:relative;
    z-index:6;
    user-select:none;
    touch-action:none;
    opacity:.30;
  }

  #ruler-corner{
    opacity:.30;
  }
  #horizontal-ruler{grid-column:2;grid-row:1;height:24px;cursor:ns-resize;border-bottom:1px solid #c8cdd4;}
  #vertical-ruler{grid-column:1;grid-row:2;width:24px;cursor:ew-resize;border-right:1px solid #c8cdd4;}
  #canvas-shell{
    grid-column:2; grid-row:2;
    position:relative;
    margin:0;
    max-width:100%;
    max-height:100%;
    box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.5);

    position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden;

  .stage-guide.vertical{top:0;bottom:0;width:1px;cursor:ew-resize;}
  .stage-guide.horizontal{left:0;right:0;height:1px;cursor:ns-resize;}
  .stage-guide::after{content:'';position:absolute;}
  .stage-guide.vertical::after{left:-5px;top:0;width:11px;height:100%;}
  .stage-guide.horizontal::after{left:0;top:-5px;width:100%;height:11px;}

  }
  #ref-image{
    position:absolute; top:0; left:0; width:100%; height:100%;

    background:#000;
  }
  #edit-overlay{
    position:absolute; top:0; left:0; width:100%; height:100%;

    z-index:3;
  }

  body.playback-active #canvas-shell *{cursor:default !important;}
  body.playback-active #canvas-shell.playback-interactive,
  body.playback-active #canvas-shell.playback-interactive *{cursor:pointer !important;}

  /* ---------- v170 off-stage object proxies ---------- */
  #offstage-proxy-layer{
    position:fixed;
    left:0;
    top:0;
    width:0;
    height:0;
    z-index:9;
    overflow:hidden;
    pointer-events:none;
  }
  .offstage-object-proxy{
    position:absolute;
    min-width:26px;
    min-height:26px;
    border:1.5px dashed rgba(14,156,134,.92);
    background:rgba(14,156,134,.055);
    transform-origin:50% 50%;
    pointer-events:auto;
    cursor:move;
    touch-action:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.65) inset;
  }
  .offstage-object-proxy::before,
  .offstage-object-proxy::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    background:#111820;
    border-radius:2px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.7);
  }
  .offstage-object-proxy::before{width:28px;height:3px;}
  .offstage-object-proxy::after{width:3px;height:28px;}
  .offstage-object-proxy.selected{
    border-style:solid;
    border-width:2px;
    background:rgba(14,156,134,.13);
    box-shadow:0 0 0 2px rgba(255,255,255,.82) inset;
  }
  .offstage-object-proxy.remote{
    border-style:dotted;
  }
  .offstage-object-proxy.partial{
    background:rgba(14,156,134,.035);
  }
  .offstage-object-proxy.dragging{
    cursor:grabbing;
  }
  .pt{
    position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px;
    border-radius:50%; background:var(--accent); border:2px solid #0c0d0e;
    cursor:grab;
  }
  .pt.first{ background:var(--warn); }
  .pt-target{
    position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px;
    border-radius:4px; border:2px solid #0c0d0e; cursor:grab;
    transform:rotate(45deg); background:var(--warn);
  }

  .shape-point-handle{
    position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px;
    border-radius:50%; background:#ffffff; border:2px solid #17212b;
    cursor:grab; z-index:9; pointer-events:auto;
    box-shadow:0 0 0 1px rgba(255,255,255,.65);
  }
  .shape-point-handle.active{background:var(--accent);}
  .shape-point-handle:hover{background:var(--accent-dim);}
  .shape-point-handle:active{cursor:grabbing;}

  .bezier-anchor-handle{
    position:absolute; width:13px; height:13px; margin:-6.5px 0 0 -6.5px;

  .native-clip-channel-body{
    display:none;
    padding:8px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .native-clip-channel.open .native-clip-channel-body{display:block;}
  .native-clip-control-row{
    display:grid;
    grid-template-columns:50px minmax(0,1fr) 72px;
    align-items:center;
    gap:7px;
    margin-bottom:7px;
  }
  .native-clip-control-row label{
    color:var(--text-dim);
    font-size:10px;
  }
  .native-clip-control-row input[type=range]{
    width:100%;
    accent-color:var(--accent);
  }
  .native-clip-control-row input[type=number]{
    width:100%;
    min-width:0;
    padding:5px 6px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--text);
    font:10px var(--mono);
  }
  .native-clip-channel-actions{
    display:flex;
    gap:6px;
    margin-top:8px;
  }
  .native-clip-channel-actions .btn{flex:1;}
  .native-clip-channel-note{
    margin-top:5px;
    color:var(--text-dim);
    font-size:9px;
    line-height:1.35;
  }
  .native-clip-rotation-dial-wrap{
    display:flex;
    justify-content:center;
    padding:3px 0 9px;
  }
  .native-clip-rotation-dial{
    width:176px;
    height:176px;
    position:relative;
    border:2px solid #8897a9;
    border-radius:50%;
    background:
      radial-gradient(circle at center,#f7f9fb 0 48%,transparent 49%),
      repeating-conic-gradient(from -1deg,rgba(98,112,130,.26) 0 1deg,transparent 1deg 45deg),
      var(--panel-2);
    box-shadow:inset 0 0 0 11px rgba(255,255,255,.63);
    touch-action:none;
    user-select:none;
    cursor:crosshair;
  }
  .native-clip-rotation-centre{
    position:absolute;
    left:50%;
    top:50%;
    width:12px;
    height:12px;
    transform:translate(-50%,-50%);
    border:2px solid #17212b;
    border-radius:50%;
    background:var(--accent);
    z-index:4;
    pointer-events:none;
  }
  .native-clip-rotation-hand{
    position:absolute;
    left:50%;
    top:50%;
    width:7px;
    height:70px;
    margin-left:-3.5px;
    margin-top:-65px;
    border-radius:5px;
    background:#8693a3;
    transform-origin:50% 65px;
    box-shadow:0 1px 2px rgba(0,0,0,.18);
    pointer-events:none;
    z-index:3;
  }
  .native-clip-rotation-dot{
    position:absolute;
    width:13px;
    height:13px;
    transform:translate(-50%,-50%);
    padding:0;
    border:1.5px solid #20303c;
    border-radius:50%;
    background:#4d9d4d;
    box-shadow:0 1px 2px rgba(0,0,0,.22);
    cursor:pointer;
    z-index:5;
  }
  .native-clip-rotation-dot:hover,
  .native-clip-rotation-dot.active{
    background:var(--accent);
    box-shadow:0 0 0 3px rgba(14,156,134,.19);
  }
  .native-clip-rotation-label{
    position:absolute;
    transform:translate(-50%,-50%);
    color:#667386;
    font:9px var(--mono);
    pointer-events:none;
    z-index:2;
  }
  .native-clip-rotation-fields{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-bottom:8px;
  }
  .native-clip-rotation-field label{
    display:block;
    margin-bottom:3px;
    color:var(--text-dim);
    font-size:9px;
    text-align:center;

  .native-clip-rotation-field input{
    width:100%;
    padding:6px 5px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--text);
    text-align:center;
    font:10px var(--mono);
  }
  .native-clip-longest{
    display:flex;
    align-items:flex-start;
    gap:7px;
    padding:7px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel-2);
    color:var(--text);
    font-size:10px;
    cursor:pointer;
  }
  .native-clip-longest input{
    margin:1px 0 0;
    accent-color:var(--accent);
  }
  .native-clip-longest span{
    color:var(--text-dim);
    font-size:9px;
    line-height:1.3;
  }
  .timeline-track-row.native-clip-part-row{
    margin-top:-1px;
  }
  .timeline-track-row.native-clip-part-row .timeline-track-name{
    color:#586575;

    font-weight:650;
    cursor:pointer;
  }
  .timeline-track-row.native-clip-part-row.active .timeline-track-name{
    color:var(--accent);

  }
  .native-clip-part-timeline-name{
    display:flex;
    align-items:center;
    gap:3px;
    min-width:0;
  }
  .native-clip-part-timeline-branch{
    flex:0 0 auto;
    color:#95a0ad;
    font:11px var(--mono);
  }
  .native-clip-part-timeline-text{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .native-clip-part-timeline-track{
    background:#f8fafb;
    border-style:dashed;
  }
  .native-clip-part-timeline-exposure{
    position:absolute;
    inset:3px;
    border-radius:3px;
    background:rgba(14,156,134,.08);
    border:1px solid rgba(14,156,134,.17);
    pointer-events:none;
  }
  .native-clip-part-key-dot{
    position:absolute;
    top:5px;
    width:10px;
    height:10px;
    margin-left:-5px;
    transform:rotate(45deg);
    border:1.5px solid #17212b;
    border-radius:2px;
    background:var(--accent);
    z-index:7;
    cursor:ew-resize;
    touch-action:none;
  }
  .native-clip-part-key-dot.move{background:#0e9c86;}
  .native-clip-part-key-dot.scale{background:#3075b8;}
  .native-clip-part-key-dot.rotate{background:#9b2f63;}
  .native-clip-part-key-dot.multiple{
    background:conic-gradient(#0e9c86 0 33%,#3075b8 33% 66%,#9b2f63 66% 100%);
  }
  .native-clip-part-key-dot:hover,
  .native-clip-part-key-dot.dragging{
    outline:2px solid rgba(14,156,134,.38);
    outline-offset:2px;

  .native-clip-timeline-toggle,

    flex:0 0 15px;

    justify-content:center;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--text-dim);
    font:800 10px/1 var(--mono);

  .native-clip-timeline-toggle:hover,
  .dembones-timeline-toggle:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
