<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Luke Animate</title>
<link rel="icon" type="image/png" href="LukeIcon.png">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f3}
  #luke-animate-editor{display:block;width:100%;height:100%;border:0;background:#eef0f3}
</style>
</head>
<body>
<iframe id="luke-animate-editor" src="editor.html?v=185.4" title="Luke Animate"></iframe>
<script>
(function(){
  'use strict';

  const frame=document.getElementById('luke-animate-editor');
  if(!frame)return;

  function installLayerLock(doc){
    if(!doc||doc.getElementById('luke-animate-layer-lock-loader-v51'))return;
    const script=doc.createElement('script');
    script.id='luke-animate-layer-lock-loader-v51';
    script.src='layer-lock.js?v=5.1.0';
    script.async=false;
    doc.body.appendChild(script);
  }

  function installFitStageExact(doc){
    if(!doc)return;
    const win=doc.defaultView;
    const button=doc.getElementById('btn-media-fit-stage');
    if(!win||!button||button.dataset.fitStageExact==='1')return;

    button.dataset.fitStageExact='1';
    button.title='Scale selected media to exactly match the stage width and height';

    button.addEventListener('click',(event)=>{
      event.preventDefault();
      event.stopImmediatePropagation();
      event.stopPropagation();

      const API=win.LukeAnimate;
      if(!API||typeof API.getSelectedDrawObjects!=='function')return;

      const selected=(API.getSelectedDrawObjects()||[]).filter(obj=>
        obj&&(obj.type==='image'||obj.type==='video')
      );
      if(selected.length!==1)return;

      const obj=selected[0];
      const stageWidth=Math.max(1,Number(API.width)||1);
      const stageHeight=Math.max(1,Number(API.height)||1);

      if(typeof API.pushUndo==='function')API.pushUndo();

      obj.x=0;
      obj.y=0;
      obj.width=stageWidth;
      obj.height=stageHeight;
      obj.tx=0;
      obj.ty=0;
      obj.tscale=1;
      obj.tscaleX=1;
      obj.tscaleY=1;
      obj.trotation=0;

      if(typeof API.refreshUI==='function')API.refreshUI();
    },true);
  }

  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      installLayerLock(doc);
      installFitStageExact(doc);
    }catch(error){
      console.error('Luke Animate page extensions could not be loaded:',error);
    }
  });
})();
</script>
</body>
</html>
