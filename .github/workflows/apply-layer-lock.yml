name: Apply LukeAnimate Layer Locking

on:
  push:
    paths:
      - '.github/layer-lock-patch.trigger'

permissions:
  contents: write

jobs:
  patch-layer-locking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layer locking patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_layer_lock.py
          python3 /tmp/apply_layer_lock.py

      - name: Validate injected layer locking script
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Luke Animate v184</title>' in s
          assert 'id="btn-lock-others"' in s
          assert 'id="btn-unlock-all"' in s
          assert 'LukeAnimate v184 layer locking extension' in s
          m=re.search(r'<script>\n/\* LukeAnimate v184 layer locking extension.*?</script>',s,re.S)
          assert m, 'injected layer locking script not found'
          code=m.group(0).replace('<script>','',1).rsplit('</script>',1)[0]
          Path('/tmp/layer-lock.js').write_text(code,encoding='utf-8')
          print('Layer locking markers validated.')
          PYTHON
          node --check /tmp/layer-lock.js

      - name: Commit layer locking
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/layer-lock-patch.trigger .github/workflows/apply-layer-lock.yml
          git add index.html .github
          git commit -m "Add persistent layer locking to Luke Animate"
          git push
