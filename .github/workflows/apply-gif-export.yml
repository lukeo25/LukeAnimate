name: Apply Luke Animate GIF export patch

on:
  push:
    branches: [main]
    paths:
      - tools/apply_gif_export_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply GIF export patch
        run: python tools/apply_gif_export_patch.py
      - name: Commit patched editor
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add GIF export to Luke Animate"
          git push
