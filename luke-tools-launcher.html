<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luke Animate</title>
<link rel="icon" type="image/png" href="LukeIcon.png">
<link rel="shortcut icon" type="image/png" href="LukeIcon.png">
<link rel="apple-touch-icon" href="LukeIcon.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #e8ecf0;
    color: #1a202c;
  }
  body {
    display: grid;
    grid-template-rows: 46px minmax(0, 1fr);
  }
  .tools-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    background: #e8ecf0;
    box-shadow: 0 3px 10px #c5ccd6;
    position: relative;
    z-index: 10;
  }
  .back-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding: 7px 15px;
    border-radius: 16px;
    background: #e8ecf0;
    color: #1a202c;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    box-shadow:
      4px 4px 9px #c5ccd6,
      -4px -4px 9px #ffffff;
    transition: color .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  .back-button:hover {
    color: #00a9c0;
    transform: translateY(-1px);
    box-shadow:
      6px 6px 12px #c1c8d2,
      -6px -6px 12px #ffffff;
  }
  .back-button:active {
    transform: translateY(0);
    box-shadow:
      inset 3px 3px 7px #c5ccd6,
      inset -3px -3px 7px #ffffff;
  }
  .bar-title {
    color: #5a6675;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #eef0f3;
  }
</style>
</head>
<body>
  <header class="tools-bar">
    <a class="back-button" href="https://lukeo25.github.io/ImageSizeCalculator/">← Luke's Tools</a>
    <span class="bar-title">LUKE ANIMATE</span>
  </header>
  <iframe id="luke-animate-frame" src="index.html?v=184" title="Luke Animate"></iframe>

<script>
(function(){
  'use strict';
  const frame = document.getElementById('luke-animate-frame');
  if(!frame) return;

  frame.addEventListener('load', ()=>{
    try{
      const doc = frame.contentDocument;
      if(!doc || doc.getElementById('luke-animate-layer-lock-loader-v3-launcher')) return;
      const script = doc.createElement('script');
      script.id = 'luke-animate-layer-lock-loader-v3-launcher';
      script.src = 'layer-lock.js?v=3.0.1';
      script.async = false;
      doc.body.appendChild(script);
    }catch(error){
      console.error('Luke Animate layer locking could not be loaded:', error);
    }
  });
})();
</script>
</body>
</html>
